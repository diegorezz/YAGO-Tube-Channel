services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cortaflow
      POSTGRES_USER: cortaflow
      POSTGRES_PASSWORD: cortaflow_secret
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./backend/sql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cortaflow']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - '8000:8000'
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://cortaflow:cortaflow_secret@postgres:5432/cortaflow
      REDIS_URL: redis://redis:6379/0
      USE_CELERY: 'true'
      STORAGE_DIR: /data/storage
    volumes:
      - media_storage:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A app.workers.celery_app:celery_app worker --loglevel=info --concurrency=2
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://cortaflow:cortaflow_secret@postgres:5432/cortaflow
      REDIS_URL: redis://redis:6379/0
      USE_CELERY: 'true'
      STORAGE_DIR: /data/storage
    volumes:
      - media_storage:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pg_data:
  media_storage:
